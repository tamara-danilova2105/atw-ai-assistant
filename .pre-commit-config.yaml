repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: poetry run ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: ruff (format)
        entry: poetry run ruff format .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pyright
        name: pyright (typecheck)
        entry: poetry run pyright
        language: system
        pass_filenames: false
        stages: [pre-push]